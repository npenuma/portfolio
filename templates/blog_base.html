<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Writing · {{ profile.name }}{% endblock %}</title>
  <meta name="description" content="{% block description %}Notes from {{ profile.name }}'s AI learning journey.{% endblock %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="icon" href="{{ url_for('static', filename='favicon-32.png') }}" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script>
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t;
          else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark'; } catch (e) {}
  </script>
</head>
<body>

<header class="nav">
  <a href="{{ url_for('index') }}" class="nav-logo" aria-label="{{ profile.name }}, home"><svg class="logo-mark" viewBox="0 0 100 100" width="38" height="38" aria-hidden="true"><polygon class="logo-hex" points="50,3 90.7,26.5 90.7,73.5 50,97 9.3,73.5 9.3,26.5"/><polygon class="logo-n" points="28,24 40,24 60,51.5 60,24 72,24 72,76 60,76 40,48.5 40,76 28,76"/></svg></a>
  <nav class="nav-links nav-links-always">
    <a href="{{ url_for('index') }}">Home</a>
    <a href="{{ url_for('blog_index') }}" class="active">Writing</a>
  </nav>
  <button class="icon-btn" id="theme-toggle" aria-label="Toggle dark mode">
    <svg class="sun" viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg>
    <svg class="moon" viewBox="0 0 24 24" width="20" height="20"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" fill="currentColor"/></svg>
  </button>
</header>

<main>
  {% block content %}{% endblock %}
</main>

<footer class="footer">© {{ profile.name }} · Built with Python &amp; Flask</footer>

<script>
  document.getElementById('theme-toggle').addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('theme', next); } catch (e) {}
  });
</script>
</body>
</html>
